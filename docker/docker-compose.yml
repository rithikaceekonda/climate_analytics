
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: climate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: climateadmin
      MINIO_ROOT_PASSWORD: ClimateLab2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.6
    container_name: climate-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      AWS_ACCESS_KEY_ID: climateadmin
      AWS_SECRET_ACCESS_KEY: ClimateLab2026!
      MINIO_ENDPOINT: http://minio:9000
      S3A_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./jars:/opt/spark/extra-jars:ro
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: climate-spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 1g
      AWS_ACCESS_KEY_ID: climateadmin
      AWS_SECRET_ACCESS_KEY: ClimateLab2026!
      MINIO_ENDPOINT: http://minio:9000
      S3A_ENDPOINT: http://minio:9000
    ports:
      - "8081:8081"
    volumes:
      - ./jars:/opt/spark/extra-jars:ro
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: climate-spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 1g
      AWS_ACCESS_KEY_ID: climateadmin
      AWS_SECRET_ACCESS_KEY: ClimateLab2026!
      MINIO_ENDPOINT: http://minio:9000
      S3A_ENDPOINT: http://minio:9000
    volumes:
      - ./jars:/opt/spark/extra-jars:ro
    restart: unless-stopped

volumes:
  minio_data:
